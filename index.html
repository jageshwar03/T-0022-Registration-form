<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="container">
          
         <form>
             <div class="box">
                <h1>Student Registration Form</h1>
             </div>
             <div class="box">
                 <label>Roll No. :</label>
                <input id="rollno" type="text">
             </div>
             <div class="box">
                <label>Student Name :</label>
                <input id="sn"  type="text" placeholder="First Name">
                <input type="text" placeholder="Last Name">
             </div>
             <div class="box">
              <label>Father's Name :</label>
                <input id="fn" type="text">
             </div>
             <div class="box">
                <label>Date of Birth :</label>
                <input id="date" type="date">
             </div>
             <div class="box">
                <label>Mobile No. :</label>
                 <input id="mn" type="text" placeholder="mobile number">
             </div>
             <div class="box">
                <label>Email Id :</label>
                <input id="email" type="email" placeholder="Enter email id">
             </div>
             <div class="box">
               <label>Password :</label>
                <input id="psdrd" type="password">
             </div>
             <div class="box">
                <label>Gender :</label>
                <input id="gender" type="radio">
                <label for="">Male</label>
                <input type="radio">
                <label for="">Female</label>
             </div>
             <div class="box">
                <label>Department :</label>
                <input id="department" type="checkbox">
                <label >CSE</label>
                <input type="checkbox">
                <label >IT</label>
                <input type="checkbox">
                <label >ECE</label>
                <input type="checkbox">
                <label >Civil</label>
             </div>
             <div class="box">
                <label>Cources :</label>
                     <select id="Cources">
                        <option>-----------Select Current Cources----------</option>
                        <option>M.tech</option>
                        <option>B.tech</option>
                        <option>BSC</option>
                    </select>
             </div>
             <div class="box">
                <label>Student Photo :</label>
                <input id="photo" type="file">
             </div>
             <div class="box">
                <label>City :</label>
                <input id="city" type="text">
             </div>
             <div class="box">
                <label>Adress :</label>
                <input id="adress" type="area">
             </div>
         </form>
      </div>
</body>
</html>
